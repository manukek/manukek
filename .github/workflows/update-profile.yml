name: Update GitHub Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Create ESM update script
        run: |
          cat > update.js << 'EOF'
          (async () => {
            import { Octokit } from "@octokit/rest";
            const fs = await import("fs");

            const octokit = new Octokit({ auth: process.env.GITHUB_TOKEN });
            const username = "manukek";

            const { data: user } = await octokit.rest.users.getByUsername({ username });
            const { data: repos } = await octokit.rest.repos.listForUser({
              username,
              type: "owner",
              per_page: 100,
            });

            const totalStars = repos.reduce((s, r) => s + r.stargazers_count, 0);
            const totalForks = repos.reduce((s, r) => s + r.forks_count, 0);
            const totalRepos = repos.length;
            const followers = user.followers;
            const following = user.following;

            let readme = fs.readFileSync("README.md", "utf8");

            readme = readme.replace(/totalStars:\s*\d+,/, `totalStars:  ${totalStars},`);
            readme = readme.replace(/totalRepos:\s*\d+,/, `totalRepos:  ${totalRepos},`);
            readme = readme.replace(/totalForks:\s*\d+,/, `totalForks:  ${totalForks},`);
            readme = readme.replace(/followers:\s*\d+,/, `followers:   ${followers},`);
            readme = readme.replace(/following:\s*\d+,/, `following:   ${following},`);

            const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
            readme = readme.replace(/<!-- TIMESTAMP -->.*<!-- \/TIMESTAMP -->/g,
              `<!-- TIMESTAMP -->${timestamp}<!-- /TIMESTAMP -->`);

            fs.writeFileSync("README.md", readme);
            console.log(`Updated: ⭐${totalStars}, Repos:${totalRepos}, 🍴${totalForks}, 👥${followers}`);
          })();
          EOF

      - name: Install dependencies
        run: |
          npm init -y
          npm install @octokit/rest

      - name: Run update
        run: node update.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update stats"
            git push
          fi
